<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Posting Period</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }

        /* Center the landing input vertically and horizontally */
        #postingContainer {
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .sapUiSizeCompact, .sapUiSizeCozy {
            width: 100%;
        }
    </style>

    <!-- Load SAPUI5 from CDN -->
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m"
        data-sap-ui-resourceroots='{"zob.zfiob52": "./"}'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        id="container"
        data-sap-ui-component
        data-name="zob.zfiob52"
        data-id="container"
        data-settings='{"id":"zob.zfiob52"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
